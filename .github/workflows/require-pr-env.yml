name: Require PR env

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read
    pull-requests: write

jobs:
    require-pr-env:
        name: Require .pr-env.json
        if: ${{ github.repository == 'blockeraai/blockera-pro' || github.event_name == 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            GITHUB_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_PR_REQUIRE_FILES: .pr-env.json
            BLOCKERA_PR_REQUIRE_FILES_FAIL: 'true'
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/lib/pr-require-files.sh
