name: Cypress E2E Tests

on:
    pull_request:
        types: [opened, synchronize, ready_for_review]
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

env:
    BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
    GITHUB_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
    BLOCKERA_E2E_SCAN_ROOTS: packages
    BLOCKERA_E2E_PACKAGE_SUFFIX: -pro
    BLOCKERA_E2E_PACKAGE_PREFIX: blockera-pro-
    BLOCKERA_E2E_GENERAL_PACKAGES: validator-pro,guard-pro,console-pro
    BLOCKERA_E2E_GENERAL_CATEGORY: general
    BLOCKERA_E2E_SHARD_SIZE: '50'
    BLOCKERA_E2E_EXCLUDE_CATEGORIES: 'plugin-compatibility*'
    BLOCKERA_E2E_PACKAGE_GLOB: 'packages/**-pro(-**|)/**'
    BLOCKERA_E2E_USE_CREATE_WP_ENV: 'true'
    BLOCKERA_E2E_WRITE_CYPRESS_ENV: 'true'
    BLOCKERA_E2E_CI_ENV: 'true'
    BLOCKERA_WP_ENV_FALLBACK_CONFIG: general
    BLOCKERA_WP_ENV_DEFAULT_PLUGIN: https://github.com/blockeraai/blockera/tree/${{ github.head_ref || github.ref_name }}
    BLOCKERA_WP_ENV_OMIT_COMPANION_PLUGINS_CATEGORIES: required-free
    BLOCKERAAI_USERNAME: ${{ secrets.BLOCKERAAI_USERNAME }}
    BLOCKERAAI_USER_PASSWORD: ${{ secrets.BLOCKERAAI_USER_PASSWORD }}

jobs:
    pr-workflow-gate:
        name: PR workflow filter
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.gate.outputs.run }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: gate
              uses: ./packages/global-packages/packages/dev-tools/github/actions/pr-workflow-gate
              with:
                  workflow-file: cypress-e2e-tests.yml
                  require-files: .pr-env.json

    detect_categories:
        name: Detecting E2E Test Categories
        needs: pr-workflow-gate
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            categories: ${{ steps.detect.outputs.categories }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - id: detect
              run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/cypress-e2e-tests/detect-categories.sh

    cypress_e2e_tests:
        name: Test
        needs: [pr-workflow-gate, detect_categories]
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' && (github.repository == 'blockeraai/blockera-pro' || github.event_name == 'pull_request') }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                category: ${{ fromJson(needs.detect_categories.outputs.categories) }}
        env:
            BLOCKERA_E2E_CATEGORY: ${{ matrix.category }}
            BLOCKERA_E2E_PRE_TEST_CMD: if [ "${BLOCKERA_E2E_CATEGORY}" != "required-free" ]; then npm run test:e2e -- --spec "packages/global-packages/packages/blockera-pro-admin/js/test/blockera-settings-account.panels.e2e.cy.js"; fi
            BLOCKERA_WP_ENV_OMIT_COMPANION_PLUGINS_CATEGORIES: required-free
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/cypress-e2e-tests/run.sh
