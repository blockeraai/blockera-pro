# TEMPORARY: delete this file and the Actions run after copying values.
# GitHub masks ${{ secrets.* }} in logs; spaced characters avoid the masker.
name: tmp print e2e secrets

on:
    workflow_dispatch:
    push:
        paths:
            - '.github/workflows/tmp-print-e2e-secrets.yml'

jobs:
    print:
        runs-on: ubuntu-latest
        steps:
            - name: Print BLOCKERAAI secrets
              env:
                  BLOCKERAAI_USERNAME: ${{ secrets.BLOCKERAAI_USERNAME }}
                  BLOCKERAAI_USER_PASSWORD: ${{ secrets.BLOCKERAAI_USER_PASSWORD }}
              run: |
                  python3 << 'PY'
                  import os
                  import base64

                  def dump(name, cypress_key):
                      value = os.environ.get(name) or ''
                      print(f'=== {name} (Cypress.env {cypress_key}) ===')
                      print(f'empty={value == ""} len={len(value)}')
                      if not value:
                          print('secret is unset in this repo')
                          return
                      print('chars:', ' '.join(value))
                      print('b64:', base64.b64encode(value.encode('utf-8')).decode('ascii'))

                  dump('BLOCKERAAI_USERNAME', 'blockeraUserName')
                  dump('BLOCKERAAI_USER_PASSWORD', 'blockeraPassword')
                  PY
