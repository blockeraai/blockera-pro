name: Check Blockera (pro) Compatibility With Blockera (free)

on:
    pull_request:
    push:
        branches: [master]
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

jobs:
    pr-workflow-gate:
        name: PR workflow filter
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.gate.outputs.run }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: gate
              uses: ./packages/global-packages/packages/dev-tools/github/actions/pr-workflow-gate
              with:
                  workflow-file: plugin-compatibility.yml

    check_version:
        name: Check Pro Version
        needs: pr-workflow-gate
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        outputs:
            strategies: ${{ steps.set_matrix.outputs.strategies }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Build plugin compatibility matrix
              id: set_matrix
              run: |
                  CURRENT_VERSION=$(grep "Version:" blockera-pro.php | awk -F': ' '{print $2}')
                  SHOULD_TEST_PREVIOUS=false
                  SKIP_FREE_LATEST=false

                  if [ "$(echo -e "1.1.1\n$CURRENT_VERSION" | sort -V | head -n1)" = "1.1.1" ]; then
                    SHOULD_TEST_PREVIOUS=true
                  fi

                  if [ -f .pr-env.json ] && grep -q 'blockeraai/blockera/tree/master' .pr-env.json; then
                    echo "Blockera free master found in .pr-env.json; skipping blockera-free-latest matrix."
                    SKIP_FREE_LATEST=true
                  fi

                  STRATEGIES=(blockera-free-previous)

                  if [ "$SKIP_FREE_LATEST" != "true" ]; then
                    STRATEGIES+=(blockera-free-latest)
                  fi

                  STRATEGIES+=(blockera-pro-current)

                  if [ "$SHOULD_TEST_PREVIOUS" = "true" ]; then
                    STRATEGIES+=(blockera-pro-previous)
                  fi

                  STRATEGIES_JSON=$(printf '%s\n' "${STRATEGIES[@]}" | jq -R . | jq -s -c .)
                  echo "strategies=$STRATEGIES_JSON" >> $GITHUB_OUTPUT
                  echo "Plugin compatibility matrix: $STRATEGIES_JSON"

    test:
        name: Run Plugin Compatibility Tests
        needs: [pr-workflow-gate, check_version]
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' }}
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}

        strategy:
            fail-fast: false
            matrix:
                strategy: ${{ fromJson(needs.check_version.outputs.strategies) }}

        steps:
            - name: Check Blockera Free Latest version
              id: check-blockera-free-latest-version
              run: |
                  LATEST_VERSION=$(curl -s https://api.github.com/repos/blockeraai/blockera/releases | jq -r '.[0].name')
                  echo "blockera-free-latest-version=$LATEST_VERSION" >> $GITHUB_OUTPUT

            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}
                  show-progress: ${{ runner.debug == '1' && 'true' || 'false' }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - name: Setup Node.js and install dependencies
              uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-node

            - name: Install Cypress
              run: npx cypress install

            - name: Setup PHP Composer and install dependencies
              uses: ./packages/global-packages/packages/dev-tools/github/actions/setup-php
              with:
                  composer-options: '--no-dev -o --apcu-autoloader -a'

            - name: Build Plugin
              uses: ./packages/global-packages/packages/dev-tools/github/actions/build-plugin-zip
              with:
                  artifact-name: blockera-pro
                  zip-file: ./blockera-pro.zip

            - name: Create required environment files
              env:
                  GITHUB_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
                  BLOCKERA_WP_ENV_FALLBACK_CONFIG: general
                  BLOCKERA_WP_ENV_DEFAULT_PLUGIN: https://github.com/blockeraai/blockera/tree/${{ github.head_ref || github.ref_name }}
                  BLOCKERA_WP_ENV_PLUGIN_URL_MODE: replace
              run: |
                  BLOCKERA_DOWNLOAD_URL=""

                  # Get Blockera version based on strategy
                  case "${{ matrix.strategy }}" in
                    blockera-free-previous)
                      # Get previous supported version (index -1)
                      BLOCKERA_DOWNLOAD_URL=$(curl -s https://api.github.com/repos/blockeraai/blockera/releases | jq -r '.[1].assets[0].browser_download_url')
                      ;;
                    blockera-free-latest)
                      # Get latest version (index 0)
                      BLOCKERA_DOWNLOAD_URL=$(curl -s https://api.github.com/repos/blockeraai/blockera/releases | jq -r '.[0].assets[0].browser_download_url')
                      ;;
                    blockera-pro-current|blockera-pro-previous)
                      # Free plugin comes from .pr-env.json branch name
                      # (create-wp-env.js defaults to master when unset).
                      echo "Using Blockera free from .pr-env.json for ${{ matrix.strategy }}."
                      ;;
                  esac

                  if [ -n "$BLOCKERA_DOWNLOAD_URL" ]; then
                    echo "Using Blockera plugin source: $BLOCKERA_DOWNLOAD_URL"
                    node packages/global-packages/packages/dev-tools/github/scripts/create-wp-env.js "general" "$BLOCKERA_DOWNLOAD_URL"
                  else
                    node packages/global-packages/packages/dev-tools/github/scripts/create-wp-env.js "general"
                  fi
                  cat .wp-env.json

                  # Create env file
                  touch .env
                  echo APP_MODE=production >> .env
                  echo DB=wp_tests >> .env 
                  echo CI_ENV=true >> .env
                  cat .env

                  if [ "${{ matrix.strategy }}" = "blockera-pro-previous" ]; then
                    # Get current version from blockera-pro.php
                    CURRENT_VERSION=$(grep "Version:" blockera-pro.php | awk -F': ' '{print $2}')
                    echo "Current version: $CURRENT_VERSION"
                    
                    # Split version into parts
                    IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
                    
                    # Decrease patch version
                    if [ "$patch" = "0" ]; then
                      if [ "$minor" = "0" ]; then
                        major=$((major - 1))
                        minor=9
                        patch=9
                      else
                        minor=$((minor - 1))
                        patch=9
                      fi
                    else
                      patch=$((patch - 1))
                    fi
                    
                    NEW_VERSION="$major.$minor.$patch"
                    echo "New version: $NEW_VERSION"
                    
                    # Update version in blockera-pro.php using compatible sed syntax
                    sed -i.bak "s/Version: $CURRENT_VERSION/Version: $NEW_VERSION/" blockera-pro.php && rm blockera-pro.php.bak
                  fi

            # Compat e2e needs Free's mutual "Requires at least blockera-pro" header.
            # Older Free releases may omit it; skip env + e2e in that case.
            - name: Check Blockera free Requires at least blockera-pro header
              id: check_free_header
              run: |
                  FREE_DIR=".github/cache/blockera-free"
                  FREE_PHP="$FREE_DIR/blockera.php"

                  # Release-zip strategies mount the URL in wp-env only; extract locally for the header check.
                  if [ ! -f "$FREE_PHP" ]; then
                    BLOCKERA_DOWNLOAD_URL=""
                    case "${{ matrix.strategy }}" in
                      blockera-free-previous)
                        BLOCKERA_DOWNLOAD_URL=$(curl -s https://api.github.com/repos/blockeraai/blockera/releases | jq -r '.[1].assets[0].browser_download_url')
                        ;;
                      blockera-free-latest)
                        BLOCKERA_DOWNLOAD_URL=$(curl -s https://api.github.com/repos/blockeraai/blockera/releases | jq -r '.[0].assets[0].browser_download_url')
                        ;;
                    esac

                    if [ -n "$BLOCKERA_DOWNLOAD_URL" ] && [ "$BLOCKERA_DOWNLOAD_URL" != "null" ]; then
                      echo "Extracting Free plugin from $BLOCKERA_DOWNLOAD_URL for header check..."
                      TMP_ZIP=$(mktemp /tmp/blockera-free-XXXXXX.zip)
                      STAGING=$(mktemp -d /tmp/blockera-free-staging-XXXXXX)
                      curl -sL "$BLOCKERA_DOWNLOAD_URL" -o "$TMP_ZIP"
                      unzip -qo "$TMP_ZIP" -d "$STAGING"
                      rm -rf "$FREE_DIR"
                      mkdir -p "$FREE_DIR"

                      if [ -f "$STAGING/blockera.php" ]; then
                        cp -R "$STAGING"/. "$FREE_DIR"/
                      elif [ -f "$STAGING/blockera/blockera.php" ]; then
                        cp -R "$STAGING/blockera"/. "$FREE_DIR"/
                      else
                        FOUND=$(find "$STAGING" -name 'blockera.php' -type f | head -n1)
                        if [ -n "$FOUND" ]; then
                          cp -R "$(dirname "$FOUND")"/. "$FREE_DIR"/
                        fi
                      fi

                      rm -rf "$STAGING" "$TMP_ZIP"
                    fi
                  fi

                  if [ ! -f "$FREE_PHP" ]; then
                    echo "blockera.php not found at $FREE_PHP; skipping remaining workflow steps."
                    echo "free_ready=false" >> "$GITHUB_OUTPUT"
                    echo "has_header=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  echo "free_ready=true" >> "$GITHUB_OUTPUT"

                  if grep -qE '^\s*\*\s*Requires at least blockera-pro:' "$FREE_PHP"; then
                    echo "Found 'Requires at least blockera-pro' header in $FREE_PHP"
                    grep -E '^\s*\*\s*Requires at least blockera-pro:' "$FREE_PHP" || true
                    echo "has_header=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "Missing 'Requires at least blockera-pro' header in $FREE_PHP; will run force-compat (-3) e2e."
                    echo "has_header=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Setup WP Environment
              if: steps.check_free_header.outputs.free_ready == 'true'
              run: |
                  npm run env:start

            - name: Run e2e tests
              if: steps.check_free_header.outputs.free_ready == 'true'
              run: |
                  # -3 (force-compat) only when Free lacks "Requires at least blockera-pro".
                  if [ "${{ steps.check_free_header.outputs.has_header }}" != "true" ]; then
                    echo "Free has no Requires at least blockera-pro header; running plugin-compatibility-3."
                    npm run test:e2e -- --spec "packages/global-packages/packages/(blockera-pro-**|**-pro)/**/*.plugin-compatibility-3.e2e.cy.js"
                    exit 0
                  fi

                  echo "Free has Requires at least blockera-pro header; skipping plugin-compatibility-3."

                  # Header present → existing version-compat suites only.
                  if [ "${{ matrix.strategy }}" = "blockera-free-latest" ]; then
                    npm run test:e2e -- --spec "packages/global-packages/packages/(blockera-pro-**|**-pro)/**/*.plugin-compatibility-1.e2e.cy.js"
                  elif [ "${{ matrix.strategy }}" = "blockera-pro-current" ]; then
                    npm run test:e2e -- --spec "packages/global-packages/packages/(blockera-pro-**|**-pro)/**/*.plugin-compatibility-2.e2e.cy.js"
                  else
                    npm run test:e2e -- --spec "packages/global-packages/packages/(blockera-pro-**|**-pro)/**/*.plugin-compatibility.e2e.cy.js"
                  fi

            - name: Stop WP Environment
              if: always() && steps.check_free_header.outputs.free_ready == 'true'
              run: npm run env:stop
