name: Remove PR Env Json

# Trigger on push to master (after a PR merges). Uses toolkit remove-pr-config-files
# with Pro-only overrides for .pr-env.json.
on:
    push:
        branches:
            - master

permissions:
    contents: write

jobs:
    pr-workflow-gate:
        name: PR workflow filter
        runs-on: ubuntu-latest
        outputs:
            run: ${{ steps.gate.outputs.run }}
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - id: gate
              uses: ./packages/global-packages/packages/dev-tools/github/actions/pr-workflow-gate
              with:
                  workflow-file: remove-pr-env-json.yml

    update-file:
        runs-on: ubuntu-latest
        needs: pr-workflow-gate
        if: ${{ needs.pr-workflow-gate.outputs.run == 'true' }}
        timeout-minutes: 30
        env:
            BLOCKERA_GLOBAL_PACKAGES_TOKEN: ${{ secrets.BLOCKERABOT_PAT }}
            BLOCKERA_PR_CONFIG_NAME: .pr-env.json
            BLOCKERA_PR_CONFIG_COMMIT_MSG: 'chore: remove .pr-env.json redundant file'
        steps:
            - uses: actions/checkout@v5
              with:
                  token: ${{ secrets.BLOCKERABOT_PAT }}

            - name: Ensure global-packages submodule
              uses: ./.github/actions/ensure-global-packages

            - run: bash packages/global-packages/packages/dev-tools/github/scripts/jobs/remove-pr-config-files/run.sh
