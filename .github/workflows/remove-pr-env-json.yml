name: Remove PR Env Json

# Trigger on push to master (this will happen after a pull request is merged)
on:
    push:
        branches:
            - master

permissions:
    contents: write

jobs:
    update-file:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Git
              run: |
                  git config user.name "blockerabot"
                  git config user.email blockeraai+githubbot@gmail.com

            # Check existence first, then remove + commit. Deleting before the
            # existence check made the commit step always skip (file already gone).
            - name: Remove .pr-env.json and push
              run: |
                  if [ -f ".pr-env.json" ]; then
                      git rm .pr-env.json
                      git commit -m "chore: remove .pr-env.json redundant file"
                      git push origin HEAD:master
                      echo "Removed .pr-env.json and pushed ✅"
                  else
                      echo "No .pr-env.json file found to remove and It is OK ✅"
                  fi
